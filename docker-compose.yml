services:
  auth_service:
    build:
      context: services/auth_service
      dockerfile: services/auth_service/Dockerfile
    container_name: auth_service
    depends_on:
      - db_init_service
    volumes:
      - auth_db_data:/auth_db_data
      - static_data:/static_data
    networks:
      - transcendence
    environment:
      SECRETS: /run/secrets/secrets
    secrets:
      - secrets

  file_upload_service:
    build:
      context: services/file_upload_service
      dockerfile: services/file_upload_service/Dockerfile
    container_name: file_upload_service
    volumes:
      - static_data:/static_data
    networks:
      - transcendence
    environment:
      SECRETS: /run/secrets/secrets
    secrets:
      - secrets


  dashboard_service:
    build:
      context: services/dashboard_service
      dockerfile: services/dashboard_service/Dockerfile
    container_name: dashboard_service
    volumes:
      - dashboard_db_data:/dashboard_data
    networks:
      - transcendence
    environment:
      SECRETS: /run/secrets/secrets
    secrets:
      - secrets

  dashboard_consumer_service:
    build:
      context: services/dashboard_consumer_service
      dockerfile: services/dashboard_consumer_service/Dockerfile
    container_name: dashboard_consumer_service
    volumes:
      - dashboard_db_data:/dashboard_data
    networks:
      - transcendence
    environment:
      SECRETS: /run/secrets/secrets
    secrets:
      - secrets

  presence_service:
    build:
      context: services/presence_service
      dockerfile: services/presence_service/Dockerfile
    container_name: presence_service
    networks:
      - transcendence
    environment:
      SECRETS: /run/secrets/secrets
    secrets:
      - secrets

  friend_service:
    build:
      context: services/friend_service
      dockerfile: services/friend_service/Dockerfile
    container_name: friend_service
    volumes:
      - friends_db_data:/friends_db_data
    networks:
      - transcendence
    environment:
      SECRETS: /run/secrets/secrets
    secrets:
      - secrets

  db_init_service:
    build:
      context: services/db_init_service
      dockerfile: services/db_init_service/Dockerfile
    container_name: db_init_service
    volumes:
      - auth_db_data:/auth_db_data
      - dashboard_db_data:/dashboard_db_data
      - friends_db_data:/friends_db_data
      - tournament_db_data:/tournament_db_data
      - static_data:/static_data
      - frontend_data:/frontend_data
    networks:
      - transcendence

  multiplayer_service:
    build:
      context: services/multiplayer_service
      dockerfile: services/multiplayer_service/Dockerfile
    container_name: multiplayer_service
    networks:
      - transcendence
    environment:
      SECRETS: /run/secrets/secrets
    secrets:
      - secrets

  splitkeyboard_service:
    build:
      context: services/splitkeyboard_service
      dockerfile: services/splitkeyboard_service/Dockerfile
    container_name: splitkeyboard_service
    networks:
      - transcendence
    environment:
      SECRETS: /run/secrets/secrets
    secrets:
      - secrets

  tournament_service:
    build:
      context: services/tournament_service
      dockerfile: services/tournament_service/Dockerfile
    container_name: tournament_service
    volumes:
      - tournament_db_data:/tournament_db_data
    networks:
      - transcendence
    environment:
      SECRETS: /run/secrets/secrets
    secrets:
      - secrets

  rabbitmq_service:
    build:
      context: services/rabbitmq_service
      dockerfile: services/rabbitmq_service/Dockerfile.dev
    container_name: rabbitmq_service
    ports:
      - "5672:5672"    # AMQP protocol port
      - "15672:15672"  # Management console port
    networks:
      - transcendence

  proxy_service:
    build:
      context: services/proxy_service
      dockerfile: services/proxy_service/Dockerfile
    container_name: proxy_service
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - frontend_data:/frontend_data
      - static_data:/static_data
      - ./proxy_service:/etc/nginx
    networks:
      - transcendence
    environment:
      SECRETS: /run/secrets/secrets
    secrets:
      - secrets

  frontend_service:
    build:
      context: client_new
      dockerfile: client_new/Dockerfile
    container_name: frontend_builder
    volumes:
      - /app/node_modules # anonymous volume -protect node_modules
      - frontend_data:/frontend_data # named volume for sharing frontend data with proxy_service
      - ../client_new:/app # bind volume
    command: >
      bash -c "npm run docker-build && cp -r /app/dist/* /frontend_data/ && tail -f /dev/null"
    # build ts, css, copies data to named volume and keeps the container running!!!

networks:
  transcendence:
    driver: bridge


volumes:
  # auth service
  auth_db_data:
  # dashboard_service db:
  dashboard_db_data:
  # friends_service db:
  friends_db_data:
  # tournament_service db:
  tournament_db_data:
  # file uploads for file_upload and proxy_service
  static_data:
  # index data
  frontend_data:

secrets:
  secrets:
    file: services/secrets/secrets.json