services:
  auth_service:
    build:
      context: services/auth_service
      dockerfile: Dockerfile
    container_name: auth_service
    depends_on:
      - db_init_service
    volumes:
      - auth_db_data:/auth_db_data
      - static_data:/static_data
    networks:
      - transcendence
    environment:
      - jwtSecret=${JWT_SECRET}
      - jwtTokenExpiration=${JWT_TOKEN_EXPIRATION}
      - emailApiKey=${EMAIL_API_KEY}
      - secureUserId=${SECURE_USER_ID}
      - dashboardRabbitPassword=${DASHBOARD_RABBIT_PASSWORD}
      - gameRabbitPassword=${GAME_RABBIT_PASSWORD}
      - splitGameRabbitPassword=${SPLIT_GAME_RABBIT_PASSWORD}
      - tourGameRabbitPassword=${TOUR_GAME_RABBIT_PASSWORD}
      - publisherRabbitPassword=${PUBLISHER_RABBIT_PASSWORD}

  file_upload_service:
    build:
      context: services/file_upload_service
      dockerfile: Dockerfile
    container_name: file_upload_service
    volumes:
      - static_data:/static_data
    networks:
      - transcendence
    environment:
      - jwtSecret=${JWT_SECRET}
      - jwtTokenExpiration=${JWT_TOKEN_EXPIRATION}
      - emailApiKey=${EMAIL_API_KEY}
      - secureUserId=${SECURE_USER_ID}
      - dashboardRabbitPassword=${DASHBOARD_RABBIT_PASSWORD}
      - gameRabbitPassword=${GAME_RABBIT_PASSWORD}
      - splitGameRabbitPassword=${SPLIT_GAME_RABBIT_PASSWORD}
      - tourGameRabbitPassword=${TOUR_GAME_RABBIT_PASSWORD}
      - publisherRabbitPassword=${PUBLISHER_RABBIT_PASSWORD}


  dashboard_service:
    build:
      context: services/dashboard_service
      dockerfile: Dockerfile
    container_name: dashboard_service
    volumes:
      - dashboard_db_data:/dashboard_data
    networks:
      - transcendence
    environment:
      - jwtSecret=${JWT_SECRET}
      - jwtTokenExpiration=${JWT_TOKEN_EXPIRATION}
      - emailApiKey=${EMAIL_API_KEY}
      - secureUserId=${SECURE_USER_ID}
      - dashboardRabbitPassword=${DASHBOARD_RABBIT_PASSWORD}
      - gameRabbitPassword=${GAME_RABBIT_PASSWORD}
      - splitGameRabbitPassword=${SPLIT_GAME_RABBIT_PASSWORD}
      - tourGameRabbitPassword=${TOUR_GAME_RABBIT_PASSWORD}
      - publisherRabbitPassword=${PUBLISHER_RABBIT_PASSWORD}

  dashboard_consumer_service:
    build:
      context: services/dashboard_consumer_service
      dockerfile: Dockerfile
    container_name: dashboard_consumer_service
    volumes:
      - dashboard_db_data:/dashboard_data
    networks:
      - transcendence
    environment:
      - jwtSecret=${JWT_SECRET}
      - jwtTokenExpiration=${JWT_TOKEN_EXPIRATION}
      - emailApiKey=${EMAIL_API_KEY}
      - secureUserId=${SECURE_USER_ID}
      - dashboardRabbitPassword=${DASHBOARD_RABBIT_PASSWORD}
      - gameRabbitPassword=${GAME_RABBIT_PASSWORD}
      - splitGameRabbitPassword=${SPLIT_GAME_RABBIT_PASSWORD}
      - tourGameRabbitPassword=${TOUR_GAME_RABBIT_PASSWORD}
      - publisherRabbitPassword=${PUBLISHER_RABBIT_PASSWORD}

  presence_service:
    build:
      context: services/presence_service
      dockerfile: Dockerfile
    container_name: presence_service
    networks:
      - transcendence
    environment:
      - jwtSecret=${JWT_SECRET}
      - jwtTokenExpiration=${JWT_TOKEN_EXPIRATION}
      - emailApiKey=${EMAIL_API_KEY}
      - secureUserId=${SECURE_USER_ID}
      - dashboardRabbitPassword=${DASHBOARD_RABBIT_PASSWORD}
      - gameRabbitPassword=${GAME_RABBIT_PASSWORD}
      - splitGameRabbitPassword=${SPLIT_GAME_RABBIT_PASSWORD}
      - tourGameRabbitPassword=${TOUR_GAME_RABBIT_PASSWORD}
      - publisherRabbitPassword=${PUBLISHER_RABBIT_PASSWORD}

  friend_service:
    build:
      context: services/friend_service
      dockerfile: Dockerfile
    container_name: friend_service
    volumes:
      - friends_db_data:/friends_db_data
    networks:
      - transcendence
    environment:
      - jwtSecret=${JWT_SECRET}
      - jwtTokenExpiration=${JWT_TOKEN_EXPIRATION}
      - emailApiKey=${EMAIL_API_KEY}
      - secureUserId=${SECURE_USER_ID}
      - dashboardRabbitPassword=${DASHBOARD_RABBIT_PASSWORD}
      - gameRabbitPassword=${GAME_RABBIT_PASSWORD}
      - splitGameRabbitPassword=${SPLIT_GAME_RABBIT_PASSWORD}
      - tourGameRabbitPassword=${TOUR_GAME_RABBIT_PASSWORD}
      - publisherRabbitPassword=${PUBLISHER_RABBIT_PASSWORD}

  db_init_service:
    build:
      context: services/db_init_service
      dockerfile: Dockerfile
    container_name: db_init_service
    volumes:
      - auth_db_data:/auth_db_data
      - dashboard_db_data:/dashboard_db_data
      - friends_db_data:/friends_db_data
      - tournament_db_data:/tournament_db_data
      - static_data:/static_data
      - frontend_data:/frontend_data
    networks:
      - transcendence

  multiplayer_service:
    build:
      context: services/multiplayer_service
      dockerfile: Dockerfile
    container_name: multiplayer_service
    networks:
      - transcendence
    environment:
      - jwtSecret=${JWT_SECRET}
      - jwtTokenExpiration=${JWT_TOKEN_EXPIRATION}
      - emailApiKey=${EMAIL_API_KEY}
      - secureUserId=${SECURE_USER_ID}
      - dashboardRabbitPassword=${DASHBOARD_RABBIT_PASSWORD}
      - gameRabbitPassword=${GAME_RABBIT_PASSWORD}
      - splitGameRabbitPassword=${SPLIT_GAME_RABBIT_PASSWORD}
      - tourGameRabbitPassword=${TOUR_GAME_RABBIT_PASSWORD}
      - publisherRabbitPassword=${PUBLISHER_RABBIT_PASSWORD}

  splitkeyboard_service:
    build:
      context: services/splitkeyboard_service
      dockerfile: Dockerfile
    container_name: splitkeyboard_service
    networks:
      - transcendence
    environment:
      - jwtSecret=${JWT_SECRET}
      - jwtTokenExpiration=${JWT_TOKEN_EXPIRATION}
      - emailApiKey=${EMAIL_API_KEY}
      - secureUserId=${SECURE_USER_ID}
      - dashboardRabbitPassword=${DASHBOARD_RABBIT_PASSWORD}
      - gameRabbitPassword=${GAME_RABBIT_PASSWORD}
      - splitGameRabbitPassword=${SPLIT_GAME_RABBIT_PASSWORD}
      - tourGameRabbitPassword=${TOUR_GAME_RABBIT_PASSWORD}
      - publisherRabbitPassword=${PUBLISHER_RABBIT_PASSWORD}

  tournament_service:
    build:
      context: services/tournament_service
      dockerfile: Dockerfile
    container_name: tournament_service
    volumes:
      - tournament_db_data:/tournament_db_data
    networks:
      - transcendence
    environment:
      - jwtSecret=${JWT_SECRET}
      - jwtTokenExpiration=${JWT_TOKEN_EXPIRATION}
      - emailApiKey=${EMAIL_API_KEY}
      - secureUserId=${SECURE_USER_ID}
      - dashboardRabbitPassword=${DASHBOARD_RABBIT_PASSWORD}
      - gameRabbitPassword=${GAME_RABBIT_PASSWORD}
      - splitGameRabbitPassword=${SPLIT_GAME_RABBIT_PASSWORD}
      - tourGameRabbitPassword=${TOUR_GAME_RABBIT_PASSWORD}
      - publisherRabbitPassword=${PUBLISHER_RABBIT_PASSWORD}

  rabbitmq_service:
    build:
      context: services/rabbitmq_service
      dockerfile: Dockerfile.dev
    container_name: rabbitmq_service
    ports:
      - "5672:5672"    # AMQP protocol port
      - "15672:15672"  # Management console port
    networks:
      - transcendence

  proxy_service:
    build:
      context: services/proxy_service
      dockerfile: Dockerfile
    container_name: proxy_service
    ports:
      - "8888:80"
      - "4343:443"
    volumes:
      - frontend_data:/app/frontend_data
      - static_data:/static_data
    networks:
      - transcendence
    environment:
      - jwtSecret=${JWT_SECRET}
      - jwtTokenExpiration=${JWT_TOKEN_EXPIRATION}
      - emailApiKey=${EMAIL_API_KEY}
      - secureUserId=${SECURE_USER_ID}
      - dashboardRabbitPassword=${DASHBOARD_RABBIT_PASSWORD}
      - gameRabbitPassword=${GAME_RABBIT_PASSWORD}
      - splitGameRabbitPassword=${SPLIT_GAME_RABBIT_PASSWORD}
      - tourGameRabbitPassword=${TOUR_GAME_RABBIT_PASSWORD}
      - publisherRabbitPassword=${PUBLISHER_RABBIT_PASSWORD}


  frontend_service:
    build:
      context: client_new
      dockerfile: Dockerfile
    container_name: frontend_builder
    volumes:
#      - /app/node_modules # anonymous volume -protect node_modules
      - frontend_data:/app/frontend_data # named volume for sharing frontend data with proxy_service
    command: >
      bash -c "npm run docker-build && cp -r /app/dist/* /app/frontend_data/ && tail -f /dev/null"
    # build ts, css, copies data to named volume and keeps the container running!!!

networks:
  transcendence:
    driver: bridge


volumes:
  # auth service
  auth_db_data:
  # dashboard_service db:
  dashboard_db_data:
  # friends_service db:
  friends_db_data:
  # tournament_service db:
  tournament_db_data:
  # file uploads for file_upload and proxy_service
  static_data:
  # index data
  frontend_data: